[project]
name = "mcpo"
version = "0.0.17"
description = "A simple, secure MCP-to-OpenAPI proxy server"
authors = [
    { name = "Timothy Jaeryang Baek", email = "tim@openwebui.com" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.8",
    "fastapi>=0.115.12",
    # Imported directly by src/mcpo/main.py (exception handling + log filter).
    # Was previously satisfied only transitively via mcp/fastapi; a resolution
    # change dropped it and mcpo failed at import with ModuleNotFoundError.
    "httpx>=0.27",
    # Capped below 2.0: mcpo imports `streamablehttp_client` from
    # `mcp.client.streamable_http`, which mcp 2.x no longer provides at that
    # path. Unpinned, uv resolved 2.2.0 and mcpo died at import with
    # "cannot import name 'streamablehttp_client'". Lift the cap only with a
    # matching change to the import in src/mcpo/main.py.
    "mcp>=1.12.4,<2",
    "mcp[cli]>=1.12.4,<2",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.11.1",
    "pyjwt[crypto]>=2.10.1",
    "python-dotenv>=1.1.0",
    "typer>=0.15.2",
    "uvicorn>=0.34.0",
    "watchdog>=4.0.0",
]

[project.scripts]
mcpo = "mcpo:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.23.0",
]
